# Paths whose reads count as "sensitive". Category names are what rules see in
# process.readCategories(). "~" matches any user's home directory.
browser:
  - "~/Library/Application Support/Google/Chrome/**/Cookies"
  - "~/Library/Application Support/Google/Chrome/**/Login Data"
  - "~/Library/Application Support/Google/Chrome/**/Web Data"
  - "~/Library/Application Support/Google/Chrome/Local State"
  - "~/Library/Application Support/BraveSoftware/Brave-Browser/**/Cookies"
  - "~/Library/Application Support/BraveSoftware/Brave-Browser/**/Login Data"
  - "~/Library/Application Support/Microsoft Edge/**/Cookies"
  - "~/Library/Application Support/Microsoft Edge/**/Login Data"
  - "~/Library/Application Support/Arc/User Data/**/Cookies"
  - "~/Library/Application Support/Arc/User Data/**/Login Data"
  - "~/Library/Application Support/Firefox/Profiles/*/cookies.sqlite"
  - "~/Library/Application Support/Firefox/Profiles/*/logins.json"
  - "~/Library/Application Support/Firefox/Profiles/*/key4.db"
  - "~/Library/Containers/com.apple.Safari/Data/Library/Cookies/Cookies.binarycookies"
  - "~/Library/Cookies/Cookies.binarycookies"
keychain:
  - "~/Library/Keychains/**"
  - "/Library/Keychains/**"
ssh:
  - "~/.ssh/id_*"
  - "~/.ssh/*.pem"
  - "~/.ssh/config"
cloud:
  - "~/.aws/credentials"
  - "~/.aws/config"
  - "~/.config/gcloud/**/*.json"
  - "~/.config/gcloud/credentials.db"
  - "~/.config/gcloud/access_tokens.db"
  - "~/.azure/**"
  - "~/.kube/config"
  - "~/.docker/config.json"
  - "~/.terraform.d/credentials.tfrc.json"
  - "~/.config/doctl/config.yaml"
  - "~/.fly/config.yml"
  - "~/.config/gh/hosts.yml"
  - "~/.config/hcloud/cli.toml"
registry:
  - "~/.npmrc"
  - "~/.pypirc"
  - "~/.netrc"
  - "~/.cargo/credentials*"
  - "~/.gem/credentials"
  - "~/.m2/settings.xml"
  - "~/.composer/auth.json"
env:
  - "**/.env"
  - "**/.env.*"
  - "**/secrets.yaml"
  - "**/secrets.yml"
  - "**/*.secrets"
gpg:
  - "~/.gnupg/**"
wallet:
  - "~/Library/Application Support/Exodus/**"
  - "~/Library/Application Support/Electrum/**"
  - "~/Library/Application Support/Ledger Live/**"
  - "~/Library/Application Support/Bitcoin/wallet.dat"
  - "~/.electrum/**"
  - "~/Library/Application Support/Google/Chrome/**/Local Extension Settings/nkbihfbeogaeaoehlefnkodbefgpgknn/**"
agent:
  - "~/.claude/.credentials.json"
  - "~/.claude.json"
  - "~/.codex/auth.json"
  - "~/.cursor/**/*.json"
  - "~/.gemini/oauth_creds.json"
  - "~/.config/anthropic/**"
password_manager:
  - "~/Library/Application Support/1Password/**"
  - "~/Library/Group Containers/*.com.1password/**"
  - "~/Library/Application Support/Bitwarden/**"
  - "~/Library/Application Support/KeePassXC/**"
  - "~/**/*.kdbx"
messaging:
  - "~/Library/Application Support/Telegram Desktop/tdata/**"
  - "~/Library/Application Support/discord/Local Storage/**"
  - "~/Library/Application Support/Slack/Cookies"
overlord:
  - "/Library/Overlord/**"
  - "/var/db/overlord/**"
  - "/Library/LaunchDaemons/com.overlord.*"
