name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -o overlord ./cmd/overlord
      - run: ./overlord replay testdata/eslogger_sample.ndjson
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: actions/upload-artifact@v4
        with:
          name: overlord-${{ github.sha }}
          path: overlord
